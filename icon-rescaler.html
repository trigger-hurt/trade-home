<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL2 DMI Helper</title>

<style>
:root{
  --bg:#16181c;
  --panel:#1d2025;
  --panel2:#252a30;
  --line:#2e343b;
  --line2:#3d444d;
  --text:#e3e7eb;
  --dim:#858e98;
  --accent:#e0a340;
  --accent2:#f0b455;
  --stage:#0f1114;
  --ck1:#1a1d21;
  --ck2:#22262b;
  --mono:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  color-scheme:dark;
  font:13px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100vh}

.top{
  display:flex;align-items:center;gap:14px;
  padding:0 14px;height:46px;flex:0 0 46px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.top h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em}
.status{
  color:var(--dim);font:11px/1 var(--mono);
  padding-left:14px;border-left:1px solid var(--line);
}
.gap{flex:1}

button.b{
  padding:6px 13px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line2);border-radius:4px;cursor:pointer;
  transition:background .12s,border-color .12s;
}
button.b:hover{background:#2e343b;border-color:#4c545e}
button.b:disabled{color:#565e67;border-color:var(--line);background:var(--panel2);cursor:default}
button.b:disabled:hover{background:var(--panel2);border-color:var(--line)}
#save:not(:disabled){background:var(--accent);border-color:var(--accent);color:#1a1204;font-weight:600}
#save:not(:disabled):hover{background:var(--accent2);border-color:var(--accent2)}

.main{display:flex;flex:1;min-height:0}

.queue{
  width:164px;flex:0 0 164px;background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.queue h2{
  font:600 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  margin:0;padding:11px 12px 10px;color:var(--dim);
  border-bottom:1px solid var(--line);
}
.queue .items{overflow-y:auto;flex:1;padding:5px}
.item{
  display:flex;gap:7px;align-items:center;width:100%;
  padding:4px 5px;border:1px solid transparent;border-radius:4px;margin-bottom:2px;
}
.item:hover{background:var(--panel2)}
.item.sel{background:rgba(224,163,64,.13);border-color:rgba(224,163,64,.55)}
.item.off{opacity:.4}
.item .pick{
  display:flex;gap:9px;align-items:center;flex:1;min-width:0;text-align:left;
  background:none;border:none;color:var(--text);cursor:pointer;padding:1px;
}
.item canvas.thumb{
  width:34px;height:34px;flex:0 0 34px;border-radius:2px;
  background:#15181b;border:1px solid var(--line);
}
.item .n{font:11px/1 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{
  flex:0 0 auto;width:24px;height:24px;line-height:22px;text-align:center;
  background:#4a2020;border:1px solid #7a3030;border-radius:4px;
  color:#ff9b8a;cursor:pointer;font-size:16px;font-weight:700;
  transition:background .12s,border-color .12s,color .12s;
}
.item .x:hover{background:#c0392b;border-color:#e0503f;color:#fff}

.right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

.stage{
  flex:1;position:relative;min-height:0;
  display:flex;align-items:safe center;justify-content:safe center;
  padding:18px;overflow:hidden;
  background-color:var(--stage);
  background-image:
    linear-gradient(45deg,var(--ck1) 25%,transparent 25%),
    linear-gradient(-45deg,var(--ck1) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,var(--ck1) 75%),
    linear-gradient(-45deg,transparent 75%,var(--ck1) 75%);
  background-size:16px 16px;
  background-position:0 0,0 8px,8px -8px,-8px 0;
}
.holder{
  position:relative;line-height:0;max-width:100%;max-height:100%;
  box-shadow:0 6px 30px rgba(0,0,0,.55);
}
.stage.zoomed .holder{max-width:none;max-height:none}
.stage.panning{cursor:grabbing}
.stage.panning *{cursor:grabbing !important}
.holder img{display:block;user-select:none;-webkit-user-drag:none}
.dim{display:none}
.box{
  position:absolute;border:1px solid var(--accent);cursor:move;
  transform-origin:center;
  box-shadow:0 0 0 4000px rgba(9,11,14,.62);   /* dims outside the (rotatable) box */
}
.box::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--accent) 1px,transparent 1px),
                   linear-gradient(90deg,var(--accent) 1px,transparent 1px);
  background-size:33.333% 33.333%;opacity:.18;
}
.h{position:absolute;width:9px;height:9px;background:var(--accent);border-radius:1px}
.h.nw{top:-5px;left:-5px;cursor:nwse-resize}
.h.ne{top:-5px;right:-5px;cursor:nesw-resize}
.h.sw{bottom:-5px;left:-5px;cursor:nesw-resize}
.h.se{bottom:-5px;right:-5px;cursor:nwse-resize}

.blank{color:var(--dim);text-align:center;max-width:340px;z-index:2}
.blank p{margin:0 0 16px;font-size:13px}
.blank p.note{font-size:12px;color:var(--dim);opacity:.85;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}

.bar{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{
  font:600 10px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);
}
.seg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{
  padding:5px 10px;font:500 11px/1 var(--mono);cursor:pointer;
  background:var(--panel2);border:none;border-right:1px solid var(--line2);
  color:var(--dim);transition:background .12s,color .12s;
}
.seg button:last-child{border-right:none}
.seg button:hover{background:#2e343b;color:var(--text)}
.seg button.on{background:var(--accent);color:#1a1204;font-weight:600}
.ctl input[type=range]{width:104px;accent-color:var(--accent)}
.val{width:42px;font:500 11px/1 var(--mono);color:var(--text)}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:var(--dim);font-size:12px}
.chk input{accent-color:var(--accent);width:14px;height:14px}

.strip{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px 12px}
.strip h2{
  font:600 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  margin:0 0 9px;color:var(--dim);
}
.strip .row{display:flex;gap:9px;overflow-x:auto;min-height:108px;align-items:flex-start;padding-bottom:3px}
.cell{flex:0 0 auto;text-align:center;cursor:pointer}
.cell canvas{
  display:block;border:1px solid var(--line2);border-radius:2px;image-rendering:pixelated;
  background-color:var(--ck2);
  background-image:
    linear-gradient(45deg,var(--ck1) 25%,transparent 25%),
    linear-gradient(-45deg,var(--ck1) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,var(--ck1) 75%),
    linear-gradient(-45deg,transparent 75%,var(--ck1) 75%);
  background-size:12px 12px;
  background-position:0 0,0 6px,6px -6px,-6px 0;
}
.cell.sel canvas{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.off{opacity:.32}
.cell span{display:block;font:11px/1 var(--mono);color:var(--dim);margin-top:5px}
.strip .none{color:var(--dim);font-size:12px;padding:36px 0}

.hide{display:none !important}
</style>

<div class="app">
  <div class="top">
    <h1>SL2 DMI Helper</h1>
    <span class="status" id="status">No images</span>
    <span class="gap"></span>
    <button class="b" id="add">Add</button>
    <button class="b" id="clear" disabled>Clear</button>
    <button class="b" id="copy" disabled>Copy</button>
    <button class="b" id="save" disabled>Export ZIP</button>
  </div>

  <div class="main">
    <div class="queue">
      <h2>Images</h2>
      <div class="items" id="list"></div>
    </div>

    <div class="right">
      <div class="stage" id="stage">
        <div class="blank" id="blank">
          <p>Drop image files here, paste with Ctrl+V, or click Add.</p>
          <p class="note">You can batch upload by adding files, or, copy and paste files into here, and it'll stack so it's faster.</p>
          <button class="b" id="add2">Add files</button>
        </div>
        <div class="holder hide" id="holder">
          <img id="pic" alt="">
          <div class="dim" id="dT"></div>
          <div class="dim" id="dB"></div>
          <div class="dim" id="dL"></div>
          <div class="dim" id="dR"></div>
          <div class="box" id="box" tabindex="0">
            <i class="h nw" data-h="nw"></i><i class="h ne" data-h="ne"></i>
            <i class="h sw" data-h="sw"></i><i class="h se" data-h="se"></i>
          </div>
        </div>
      </div>

      <div class="bar">
        <div class="ctl">
          <label>Size</label>
          <div class="seg" id="sizeSeg">
            <button data-v="32">32</button><button data-v="64">64</button><button data-v="96" class="on">96</button><button data-v="128">128</button><button data-v="160">160</button><button data-v="192">192</button><button data-v="256">256</button>
          </div>
        </div>
        <div class="ctl">
          <label for="sharp">Sharpen</label>
          <input type="range" id="sharp" min="0" max="100" step="5" value="45">
          <span class="val" id="sharpV">45%</span>
        </div>
        <div class="ctl">
          <label>Mode</label>
          <div class="seg" id="modeSeg">
            <button data-v="1" class="on">Clamped</button><button data-v="0">Plain</button>
          </div>
        </div>
        <div class="ctl">
          <label>Mix</label>
          <div class="seg" id="mixSeg">
            <button data-v="1" class="on">Linear</button><button data-v="0">sRGB</button>
          </div>
        </div>
        <div class="ctl">
          <label for="crop">Crop</label>
          <input type="range" id="crop" min="5" max="100" step="1" value="55">
          <span class="val" id="cropV">-</span>
        </div>
        <div class="ctl">
          <label>Rotate</label>
          <div class="seg" id="rotSeg">
            <button data-r="-90" title="Rotate left 90&deg;">&#8634;</button><button data-r="90" title="Rotate right 90&deg;">&#8635;</button><button data-r="180" title="Flip 180&deg;">180&deg;</button><button data-r="reset" title="Reset to 0&deg;">0</button>
          </div>
          <input type="range" id="rotSlider" min="0" max="359" step="1" value="0" title="Custom angle">
          <span class="val" id="rotV">0&deg;</span>
        </div>
        <div class="ctl">
          <label for="zoom">Zoom</label>
          <input type="range" id="zoom" min="100" max="600" step="10" value="100">
          <span class="val" id="zoomV">Fit</span>
        </div>
        <div class="ctl">
          <label>Colors</label>
          <div class="seg" id="colSeg">
            <button data-c="0" class="on">Off</button><button data-c="1">255</button>
          </div>
          <div class="seg" id="palSeg">
            <button data-p="per" class="on">Per img</button><button data-p="all">Shared</button>
          </div>
        </div>
        <label class="chk"><input type="checkbox" id="inc" checked> Include</label>
      </div>

      <div class="strip">
        <h2>Preview at actual size</h2>
        <div class="row" id="strip"><span class="none">Nothing loaded.</span></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" multiple class="hide">

<script>
(function(){
"use strict";

var items = [];
var active = -1;
var outSize = 96;
var sharpen = 0.45;
var clamped = true;
var linear = true;
var zoom = 1;              // stage display multiplier over the fit scale
var reduceColors = false;  // quantize output to <=255 colors
var paletteScope = "per";  // "per" (per-image palette) | "all" (one shared palette)
var MAX_COLORS = 255;
var sharedPalette = null;  // cached global palette when scope === "all"

// Oversized sources are shrunk to this longest-side once on load, so a big
// image doesn't pay a full-resolution Lanczos pass on every single edit.
// 1024 leaves normal (<=1k) art untouched.
var RENDER_CAP = 1024;

// Hard ceiling on how many images can be loaded at once.
var MAX_IMAGES = 150;

function $(id){ return document.getElementById(id); }

/* One-time, high-quality stepped downscale used to build the working source. */
function downscale(img, sw, sh, dw, dh){
  var cw = sw, ch = sh;
  var cur = document.createElement("canvas");
  cur.width = cw; cur.height = ch;
  cur.getContext("2d").drawImage(img, 0, 0);
  while (cw > dw * 2 && ch > dh * 2){
    var nw = Math.max(dw, Math.round(cw / 2)), nh = Math.max(dh, Math.round(ch / 2));
    var c = document.createElement("canvas");
    c.width = nw; c.height = nh;
    var cx = c.getContext("2d");
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
    cx.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
    cur = c; cw = nw; ch = nh;
  }
  if (cw !== dw || ch !== dh){
    var f = document.createElement("canvas");
    f.width = dw; f.height = dh;
    var fx = f.getContext("2d");
    fx.imageSmoothingEnabled = true; fx.imageSmoothingQuality = "high";
    fx.drawImage(cur, 0, 0, cw, ch, 0, 0, dw, dh);
    cur = f;
  }
  return cur;
}

/* Small center-square canvas for the queue list. Drawn once so scrolling the
   side list never re-decodes the (possibly huge) source images. */
function makeThumbCanvas(img, iw, ih){
  var TS = 68; // 2x, displayed at 34px
  var c = document.createElement("canvas");
  c.className = "thumb";
  c.width = TS; c.height = TS;
  var g = c.getContext("2d");
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "medium";
  var side = Math.min(iw, ih);
  g.drawImage(img, (iw - side) / 2, (ih - side) / 2, side, side, 0, 0, TS, TS);
  return c;
}

/* Source shown in the stage. For oversized images use the pre-shrunk 1024 copy
   so selecting doesn't decode a multi-thousand-pixel original every click.
   Crop math stays in original pixel space, so this only changes display cost. */
function dispSrc(it){
  if (!it.rsc || it.rsc >= 1) return it.url;
  if (!it.disp) it.disp = it.rsrc.toDataURL("image/png");
  return it.disp;
}

/* Rotate a square RGBA buffer by 90/180/270 degrees clockwise. Lossless. */
function rotateSquare(bytes, n, deg){
  if (!deg) return bytes;
  var out = new Uint8ClampedArray(n * n * 4);
  for (var y = 0; y < n; y++){
    for (var x = 0; x < n; x++){
      var sx, sy;
      if (deg === 90){ sx = y; sy = n - 1 - x; }
      else if (deg === 180){ sx = n - 1 - x; sy = n - 1 - y; }
      else { sx = n - 1 - y; sy = x; }            // 270
      var si = (sy * n + sx) * 4, di = (y * n + x) * 4;
      out[di] = bytes[si]; out[di+1] = bytes[si+1];
      out[di+2] = bytes[si+2]; out[di+3] = bytes[si+3];
    }
  }
  return out;
}

/* ---- colour quantisation (median cut) ----
   Reduces an image to <=maxColors distinct RGB values. Used for palette-limited
   DMI output, either per image or against one shared palette. */
function medianCut(samples, maxColors){
  if (!samples.length) return [];
  var boxes = [samples];
  while (boxes.length < maxColors){
    var bi = -1, best = -1, chan = 0;
    for (var i = 0; i < boxes.length; i++){
      var box = boxes[i];
      if (box.length < 2) continue;
      var mn0=255,mn1=255,mn2=255,mx0=0,mx1=0,mx2=0;
      for (var p = 0; p < box.length; p++){
        var s = box[p];
        if (s[0]<mn0)mn0=s[0]; if (s[0]>mx0)mx0=s[0];
        if (s[1]<mn1)mn1=s[1]; if (s[1]>mx1)mx1=s[1];
        if (s[2]<mn2)mn2=s[2]; if (s[2]>mx2)mx2=s[2];
      }
      var r0=mx0-mn0, r1=mx1-mn1, r2=mx2-mn2;
      if (r0>best){best=r0;bi=i;chan=0;}
      if (r1>best){best=r1;bi=i;chan=1;}
      if (r2>best){best=r2;bi=i;chan=2;}
    }
    if (bi < 0) break;
    var b = boxes[bi];
    b.sort(function(a,c){ return a[chan]-c[chan]; });
    var mid = b.length >> 1;
    boxes.splice(bi, 1, b.slice(0, mid), b.slice(mid));
  }
  return boxes.map(function(box){
    var r=0,g=0,bl=0;
    for (var p=0;p<box.length;p++){ r+=box[p][0]; g+=box[p][1]; bl+=box[p][2]; }
    var n=Math.max(1,box.length);
    return [Math.round(r/n),Math.round(g/n),Math.round(bl/n)];
  });
}

function sampleBytes(bytes, n){
  var total = n*n, stride = Math.max(1, Math.floor(total/2048)), out = [];
  for (var i = 0; i < total; i += stride){
    var o = i*4;
    if (bytes[o+3] < 8) continue;
    out.push([bytes[o], bytes[o+1], bytes[o+2]]);
  }
  return out;
}

/* Sample the crop region of one image straight from its source, so a shared
   palette can be built without depending on render order. */
function collectCropSamples(it, sink){
  var src = it.rsrc || it.img;
  if (!src) return;
  var N = 24, rsc = it.rsc || 1;
  var tmp = document.createElement("canvas");
  tmp.width = N; tmp.height = N;
  var g = tmp.getContext("2d", { willReadFrequently: true });
  var s = Math.max(1, Math.round(it.crop.s * rsc));
  try {
    g.drawImage(src, Math.round(it.crop.x*rsc), Math.round(it.crop.y*rsc), s, s, 0, 0, N, N);
    var d = g.getImageData(0, 0, N, N).data;
    for (var i = 0; i < N*N; i++){ var o=i*4; if (d[o+3] < 8) continue; sink.push([d[o],d[o+1],d[o+2]]); }
  } catch (e){ /* tainted canvas — skip */ }
}

function buildSharedPalette(){
  var samples = [];
  items.forEach(function(it){ if (it.include) collectCropSamples(it, samples); });
  sharedPalette = samples.length ? medianCut(samples, MAX_COLORS) : null;
}

function paletteFor(it, bytes){
  if (paletteScope === "all"){
    if (!sharedPalette) buildSharedPalette();
    return sharedPalette;
  }
  return medianCut(sampleBytes(bytes, outSize), MAX_COLORS);
}

function remapToPalette(bytes, n, pal){
  if (!pal || !pal.length) return;
  var cache = {};
  var total = n*n;
  for (var i = 0; i < total; i++){
    var o = i*4;
    if (bytes[o+3] === 0) continue;
    var r = bytes[o], g = bytes[o+1], b = bytes[o+2];
    var key = ((r>>2)<<12) | ((g>>2)<<6) | (b>>2);
    var idx = cache[key];
    if (idx === undefined){
      var bestD = Infinity, bestI = 0;
      for (var q = 0; q < pal.length; q++){
        var dr=r-pal[q][0], dg=g-pal[q][1], db=b-pal[q][2];
        var dd = dr*dr+dg*dg+db*db;
        if (dd < bestD){ bestD = dd; bestI = q; }
      }
      idx = bestI; cache[key] = idx;
    }
    bytes[o] = pal[idx][0]; bytes[o+1] = pal[idx][1]; bytes[o+2] = pal[idx][2];
  }
}

function setStatus(t){ $("status").textContent = t; }

var S2L = (function(){
  var t = new Float32Array(256);
  for (var i = 0; i < 256; i++){
    var c = i / 255;
    t[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  return t;
})();

function l2s(v){
  if (v <= 0) return 0;
  if (v >= 1) return 1;
  return v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
}

function toFloat(u8, n, lin){
  var f = new Float32Array(n * 4);
  for (var i = 0, o = 0; i < n; i++, o += 4){
    if (lin){
      f[o] = S2L[u8[o]]; f[o+1] = S2L[u8[o+1]]; f[o+2] = S2L[u8[o+2]];
    } else {
      f[o] = u8[o] / 255; f[o+1] = u8[o+1] / 255; f[o+2] = u8[o+2] / 255;
    }
    f[o+3] = u8[o+3] / 255;
  }
  return f;
}

var BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

function toBytes(f, w, h, lin){
  var out = new Uint8ClampedArray(w * h * 4);
  for (var y = 0; y < h; y++){
    for (var x = 0; x < w; x++){
      var o = (y * w + x) * 4;
      var d = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.46875) / 255;
      for (var c = 0; c < 3; c++){
        var v = lin ? l2s(f[o+c]) : f[o+c];
        out[o+c] = Math.round((v + d) * 255);
      }
      out[o+3] = Math.round(f[o+3] * 255);
    }
  }
  return out;
}

function lanczos(x, a){
  if (x === 0) return 1;
  if (x <= -a || x >= a) return 0;
  var px = Math.PI * x;
  return a * Math.sin(px) * Math.sin(px / a) / (px * px);
}

function weights(srcLen, dstLen, a){
  var ratio = dstLen / srcLen;
  var scale = ratio < 1 ? 1 / ratio : 1;
  var support = a * scale;
  var out = new Array(dstLen);
  for (var i = 0; i < dstLen; i++){
    var center = (i + 0.5) / ratio - 0.5;
    var start = Math.max(0, Math.ceil(center - support));
    var end = Math.min(srcLen - 1, Math.floor(center + support));
    var idx = [], wts = [], sum = 0;
    for (var j = start; j <= end; j++){
      var w = lanczos((j - center) / scale, a);
      if (w !== 0){ idx.push(j); wts.push(w); sum += w; }
    }
    if (sum === 0){
      idx = [Math.min(srcLen - 1, Math.max(0, Math.round(center)))];
      wts = [1]; sum = 1;
    }
    for (var k = 0; k < wts.length; k++) wts[k] /= sum;
    out[i] = { idx: idx, wts: wts };
  }
  return out;
}

function resample(src, sw, sh, dw, dh){
  var a = 3;
  var wx = weights(sw, dw, a);
  var wy = weights(sh, dh, a);
  var tmp = new Float32Array(dw * sh * 4);

  for (var y = 0; y < sh; y++){
    var rowOff = y * sw * 4;
    for (var x = 0; x < dw; x++){
      var f = wx[x], r = 0, g = 0, b = 0, al = 0;
      for (var k = 0; k < f.idx.length; k++){
        var o = rowOff + f.idx[k] * 4, w = f.wts[k], aa = src[o + 3];
        r += src[o] * aa * w; g += src[o+1] * aa * w; b += src[o+2] * aa * w; al += aa * w;
      }
      var t = (y * dw + x) * 4;
      tmp[t] = r; tmp[t+1] = g; tmp[t+2] = b; tmp[t+3] = al;
    }
  }

  var out = new Float32Array(dw * dh * 4);
  for (var dy = 0; dy < dh; dy++){
    var fy = wy[dy];
    for (var dx = 0; dx < dw; dx++){
      var r2 = 0, g2 = 0, b2 = 0, a2 = 0;
      for (var m = 0; m < fy.idx.length; m++){
        var o2 = (fy.idx[m] * dw + dx) * 4, w2 = fy.wts[m];
        r2 += tmp[o2] * w2; g2 += tmp[o2+1] * w2; b2 += tmp[o2+2] * w2; a2 += tmp[o2+3] * w2;
      }
      var d = (dy * dw + dx) * 4;
      if (a2 > 1e-6){ out[d] = r2 / a2; out[d+1] = g2 / a2; out[d+2] = b2 / a2; }
      out[d+3] = a2;
    }
  }
  return out;
}

function sharpenPass(f, w, h, amount, clamp){
  if (amount <= 0) return f;
  var n = w * h;
  var blur = new Float32Array(n * 3);
  var lo = clamp ? new Float32Array(n * 3) : null;
  var hi = clamp ? new Float32Array(n * 3) : null;
  var kern = [1,2,1,2,4,2,1,2,1];

  for (var y = 0; y < h; y++){
    for (var x = 0; x < w; x++){
      var r = 0, g = 0, b = 0, ki = 0;
      var r0 = 2, g0 = 2, b0 = 2, r1 = -1, g1 = -1, b1 = -1;
      for (var dy = -1; dy <= 1; dy++){
        var yy = Math.min(h - 1, Math.max(0, y + dy));
        for (var dx = -1; dx <= 1; dx++){
          var xx = Math.min(w - 1, Math.max(0, x + dx));
          var o = (yy * w + xx) * 4, k = kern[ki++];
          var vr = f[o], vg = f[o+1], vb = f[o+2];
          r += vr * k; g += vg * k; b += vb * k;
          if (clamp){
            if (vr < r0) r0 = vr; if (vr > r1) r1 = vr;
            if (vg < g0) g0 = vg; if (vg > g1) g1 = vg;
            if (vb < b0) b0 = vb; if (vb > b1) b1 = vb;
          }
        }
      }
      var t = (y * w + x) * 3;
      blur[t] = r / 16; blur[t+1] = g / 16; blur[t+2] = b / 16;
      if (clamp){
        lo[t] = r0; lo[t+1] = g0; lo[t+2] = b0;
        hi[t] = r1; hi[t+1] = g1; hi[t+2] = b1;
      }
    }
  }

  for (var i = 0, p = 0; i < n; i++, p += 3){
    var o2 = i * 4;
    for (var c = 0; c < 3; c++){
      var v = f[o2+c] + amount * (f[o2+c] - blur[p+c]);
      if (clamp) v = Math.min(hi[p+c], Math.max(lo[p+c], v));
      f[o2+c] = v;
    }
  }
  return f;
}

function render(it){
  var c = it.crop;
  var rsc = it.rsc || 1;
  var src = it.rsrc || it.img;
  var s = Math.max(1, Math.round(c.s * rsc));
  var cut = document.createElement("canvas");
  cut.width = s; cut.height = s;
  var cx = cut.getContext("2d", { willReadFrequently: true });
  var th = (it.rot || 0) * Math.PI / 180;
  if (th){
    // Sample a rotated square: spin the source about the crop centre so the
    // tilted selection lands upright in the output (fills, no empty corners).
    var ccx = (c.x + c.s / 2) * rsc, ccy = (c.y + c.s / 2) * rsc;
    cx.save();
    cx.translate(s / 2, s / 2);
    cx.rotate(-th);
    cx.translate(-ccx, -ccy);
    cx.drawImage(src, 0, 0);
    cx.restore();
  } else {
    cx.drawImage(src, Math.round(c.x * rsc), Math.round(c.y * rsc), s, s, 0, 0, s, s);
  }

  var cur = s;
  while (cur > 1024){
    var half = Math.max(outSize, Math.round(cur / 2));
    var step = document.createElement("canvas");
    step.width = half; step.height = half;
    var sctx = step.getContext("2d", { willReadFrequently: true });
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = "high";
    sctx.drawImage(cut, 0, 0, cur, cur, 0, 0, half, half);
    cut = step; cx = sctx; cur = half;
  }

  var raw;
  try {
    raw = cx.getImageData(0, 0, cur, cur).data;
  } catch (err){
    var e2 = new Error(location.protocol === "file:"
      ? "Blocked under file:// - serve over http instead"
      : "Pixel read blocked (" + err.name + ")");
    e2.name = "CanvasBlocked";
    throw e2;
  }

  var f = toFloat(raw, cur * cur, linear);
  var px = resample(f, cur, cur, outSize, outSize);
  sharpenPass(px, outSize, outSize, sharpen, clamped);
  var bytes = toBytes(px, outSize, outSize, linear);

  if (reduceColors) remapToPalette(bytes, outSize, paletteFor(it, bytes));

  var out = it.canvas || document.createElement("canvas");
  out.width = outSize; out.height = outSize;
  out.style.width = outSize + "px";
  out.style.height = outSize + "px";
  out.getContext("2d").putImageData(new ImageData(bytes, outSize, outSize), 0, 0);
  it.canvas = out;
  it.broken = false;
  it.dirty = false;
  return out;
}

/* ---- background render scheduler ----
   Rendering 90 images at once froze the tab for ~15s. Instead we render one
   at a time and yield to the event loop between each, so the UI stays live and
   thumbnails stream in. The active image is always rendered first. */
var renderQueue = [];
var pumping = false;
var renderErr = null;

function enqueue(list){
  for (var i = 0; i < list.length; i++){
    var it = list[i];
    if (it && renderQueue.indexOf(it) === -1) renderQueue.push(it);
  }
  pump();
}

function pump(){
  if (pumping || !renderQueue.length) return;
  pumping = true;
  function step(){
    if (!renderQueue.length){
      pumping = false;
      drawList();
      if (renderErr){ setStatus(renderErr.message); renderErr = null; }
      return;
    }
    var idx = 0, act = items[active];
    if (act){ var a = renderQueue.indexOf(act); if (a >= 0) idx = a; }
    var it = renderQueue.splice(idx, 1)[0];
    try { render(it); } catch (e){ it.broken = true; if (!renderErr) renderErr = e; }
    if (renderQueue.length){
      setStatus("Rendering " + renderQueue.length + " left…");
      setTimeout(step, 0);
    } else {
      pumping = false;
      drawList();
      if (renderErr){ setStatus(renderErr.message); renderErr = null; }
    }
  }
  setTimeout(step, 0);
}

/* A global option changed: everything is stale. Render the active one now for
   instant feedback, then stream the rest in the background. */
function renderAll(){
  renderErr = null;
  items.forEach(function(it){ it.dirty = true; });
  var act = items[active];
  if (act){
    try { render(act); } catch (e){ act.broken = true; renderErr = e; }
  }
  enqueue(items.filter(function(it){ return it.dirty; }));
}

function removeItem(i){
  var it = items[i];
  if (!it) return;
  if (it.url) URL.revokeObjectURL(it.url);
  var qi = renderQueue.indexOf(it);
  if (qi >= 0) renderQueue.splice(qi, 1);
  items.splice(i, 1);
  sharedPalette = null;

  if (active === i) active = -1;
  else if (active > i) active--;
  if (active < 0 && items.length) active = Math.min(i, items.length - 1);

  if (active >= 0){
    var a = items[active];
    $("blank").classList.add("hide");
    $("holder").classList.remove("hide");
    $("pic").src = dispSrc(a);
    $("inc").checked = a.include;
    $("rotV").textContent = (a.rot || 0) + "°";
    $("rotSlider").value = Math.round((((a.rot || 0) % 360) + 360) % 360);
    requestAnimationFrame(place);
  } else {
    $("holder").classList.add("hide");
    $("blank").classList.remove("hide");
  }
  drawList();
  drawStrip();
}

function clearAll(){
  items.forEach(function(it){ if (it.url) URL.revokeObjectURL(it.url); });
  items = [];
  renderQueue = [];
  active = -1;
  sharedPalette = null;
  $("holder").classList.add("hide");
  $("blank").classList.remove("hide");
  drawList();
  drawStrip();
}

function exportName(i){ return (i + 1) + ".png"; }

function drawList(){
  var box = $("list");
  box.innerHTML = "";
  items.forEach(function(it, i){
    var row = document.createElement("div");
    row.className = "item" + (i === active ? " sel" : "") + (it.include ? "" : " off");

    var pick = document.createElement("button");
    pick.className = "pick";
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = it.w + " x " + it.h;
    pick.appendChild(it.thumbCanvas); pick.appendChild(n);
    pick.addEventListener("click", function(){ select(i); });

    var x = document.createElement("button");
    x.className = "x";
    x.textContent = "×";
    x.title = "Remove";
    x.addEventListener("click", function(e){ e.stopPropagation(); removeItem(i); });

    row.appendChild(pick); row.appendChild(x);
    box.appendChild(row);
  });
  var inc = items.filter(function(x){ return x.include; }).length;
  $("save").disabled = inc === 0;
  $("copy").disabled = active < 0;
  $("clear").disabled = items.length === 0;
  if (items.length) setStatus(items.length + " loaded, " + inc + " to export, " + outSize + "px");
  else setStatus("No images");
}

/* Reuse one canvas element per item so a background re-render just repaints it
   in place — no strip rebuild needed while previews stream in. */
function ensureCanvas(it){
  if (!it.canvas){
    var cv = document.createElement("canvas");
    cv.width = outSize; cv.height = outSize;
    cv.style.width = outSize + "px"; cv.style.height = outSize + "px";
    it.canvas = cv;
    it.dirty = true;
  }
  return it.canvas;
}

function drawStrip(){
  var row = $("strip");
  row.innerHTML = "";
  if (!items.length){
    row.innerHTML = '<span class="none">Nothing loaded.</span>';
    return;
  }
  var num = 0, need = [];
  items.forEach(function(it, i){
    var cv = ensureCanvas(it);
    if (it.dirty) need.push(it);
    var cell = document.createElement("div");
    cell.className = "cell" + (i === active ? " sel" : "") + (it.include ? "" : " off");
    cell.appendChild(cv);
    var tag = document.createElement("span");
    tag.textContent = it.include ? exportName(num++) : "skipped";
    cell.appendChild(tag);
    cell.addEventListener("click", function(){ select(i); });
    row.appendChild(cell);
  });
  if (need.length) enqueue(need);
}

function select(i){
  var it = items[i];
  if (!it) return;
  var prev = active;
  active = i;
  $("blank").classList.add("hide");
  $("holder").classList.remove("hide");
  $("pic").src = dispSrc(it);
  $("inc").checked = it.include;
  $("rotV").textContent = (it.rot || 0) + "°";
  $("rotSlider").value = Math.round((((it.rot || 0) % 360) + 360) % 360);

  /* Only move the highlight between the two affected rows/cells. Rebuilding the
     whole queue + strip on every click was what made switching lag with many
     images. DOM order matches items order, so index maps directly. */
  var rows = $("list").children, cells = $("strip").children;
  if (prev >= 0){
    if (rows[prev]) rows[prev].classList.remove("sel");
    if (cells[prev]) cells[prev].classList.remove("sel");
  }
  if (rows[i]) rows[i].classList.add("sel");
  if (cells[i]) cells[i].classList.add("sel");
  $("copy").disabled = false;

  requestAnimationFrame(place);
}

function scale(){
  var it = items[active];
  if (!it) return 1;
  return $("pic").clientWidth / it.w || 1;
}

function fit(){
  var it = items[active];
  if (!it) return;
  var st = $("stage");
  var aw = Math.max(80, st.clientWidth - 32);
  var ah = Math.max(80, st.clientHeight - 32);
  var base = Math.min(aw / it.w, ah / it.h, 1);
  if (!isFinite(base) || base <= 0) base = 1;
  var k = base * zoom;                     // zoom enlarges beyond the fit scale
  var img = $("pic");
  img.style.width = Math.max(1, Math.round(it.w * k)) + "px";
  img.style.height = Math.max(1, Math.round(it.h * k)) + "px";
  // Always scrollable (no hidden<->auto jump); the holder exceeds the stage
  // only when zoomed. safe-center handles fit vs overflow alignment.
  st.style.overflow = "auto";
  st.classList.toggle("zoomed", zoom > 1);
}

function panel(el, x, y, w, h){
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.width = Math.max(0, w) + "px"; el.style.height = Math.max(0, h) + "px";
}

function place(){
  var it = items[active];
  if (!it) return;
  fit();
  var k = scale(), c = it.crop;
  var x = c.x * k, y = c.y * k, s = c.s * k;
  var el = $("box");
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.width = s + "px"; el.style.height = s + "px";
  // Rotate the selection box in place; its box-shadow dims everything outside.
  el.style.transform = it.rot ? "rotate(" + it.rot + "deg)" : "";
  $("crop").value = Math.min(100, Math.max(5, Math.round(c.s / Math.min(it.w, it.h) * 100)));
  $("cropV").textContent = Math.round(c.s) + "px";
}

function clampCrop(it){
  var c = it.crop;
  var max = Math.min(it.w, it.h);
  c.s = Math.max(8, Math.min(max, c.s));
  c.x = Math.max(0, Math.min(it.w - c.s, c.x));
  c.y = Math.max(0, Math.min(it.h - c.s, c.y));
}

function commit(){
  var it = items[active];
  if (!it) return;
  clampCrop(it);
  place();
  try { render(it); } catch (e){ it.broken = true; setStatus(e.message); }
  drawStrip();
}

(function(){
  var mode = null, grip = null, start = null;

  $("box").addEventListener("pointerdown", function(e){
    if (e.button !== 0) return;              // left button only; middle pans the stage
    var it = items[active];
    if (!it) return;
    grip = e.target.dataset ? e.target.dataset.h : null;
    mode = grip ? "size" : "move";
    start = { mx: e.clientX, my: e.clientY, c: { x: it.crop.x, y: it.crop.y, s: it.crop.s } };
    try { e.target.setPointerCapture(e.pointerId); } catch (_){}
    e.preventDefault();
  });

  window.addEventListener("pointermove", function(e){
    if (!mode) return;
    var it = items[active];
    var k = scale();
    var sdx = (e.clientX - start.mx) / k;   // drag delta in image pixels (upright)
    var sdy = (e.clientY - start.my) / k;
    if (mode === "move"){
      // Image is upright, so the box just follows the cursor.
      it.crop.x = start.c.x + sdx;
      it.crop.y = start.c.y + sdy;
    } else {
      // Resize a (possibly rotated) square from its centre. Map the screen drag
      // into the box's own axes so grips feel right at any angle.
      var th = (it.rot || 0) * Math.PI / 180, ct = Math.cos(th), stt = Math.sin(th);
      var ldx = sdx * ct + sdy * stt;
      var ldy = -sdx * stt + sdy * ct;
      var d = grip === "se" ? (ldx + ldy) / 2
            : grip === "nw" ? -(ldx + ldy) / 2
            : grip === "ne" ? (ldx - ldy) / 2
            : (ldy - ldx) / 2;
      var max = Math.min(it.w, it.h);
      var ns = Math.max(8, Math.min(max, start.c.s + d));
      var ccx = start.c.x + start.c.s / 2, ccy = start.c.y + start.c.s / 2;
      it.crop.s = ns;
      it.crop.x = ccx - ns / 2;
      it.crop.y = ccy - ns / 2;
    }
    clampCrop(it);
    place();
  });

  window.addEventListener("pointerup", function(){
    if (!mode) return;
    mode = null; grip = null;
    commit();
  });
})();

$("box").addEventListener("keydown", function(e){
  var it = items[active];
  if (!it) return;
  var step = e.shiftKey ? 10 : 1;
  var k = e.key;
  if (k === "ArrowLeft") it.crop.x -= step;
  else if (k === "ArrowRight") it.crop.x += step;
  else if (k === "ArrowUp") it.crop.y -= step;
  else if (k === "ArrowDown") it.crop.y += step;
  else if (k === "+" || k === "=") it.crop.s += step;
  else if (k === "-" || k === "_") it.crop.s -= step;
  else if (k === "Delete" || k === "Backspace"){ e.preventDefault(); removeItem(active); return; }
  else return;
  e.preventDefault();
  commit();
});

function load(files){
  var list = Array.prototype.slice.call(files).filter(function(f){
    return /^image\//.test(f.type);
  });
  if (!list.length){ setStatus("No usable image"); return; }

  // Enforce the 150-image cap: take only what fits, report the rest.
  var room = MAX_IMAGES - items.length;
  if (room <= 0){ setStatus("Limit reached — " + MAX_IMAGES + " images max"); return; }
  var overflow = 0;
  if (list.length > room){ overflow = list.length - room; list = list.slice(0, room); }

  var pending = list.length, added = 0, bad = 0;

  list.forEach(function(f){
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function(){
      var iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih){
        URL.revokeObjectURL(url); bad++; return done();
      }
      // Build a capped working source once; normal art (<=RENDER_CAP) is untouched.
      var rsc = 1, rsrc = img, maxSide = Math.max(iw, ih);
      if (maxSide > RENDER_CAP){
        rsc = RENDER_CAP / maxSide;
        rsrc = downscale(img, iw, ih, Math.max(1, Math.round(iw * rsc)), Math.max(1, Math.round(ih * rsc)));
      }
      var thumb = makeThumbCanvas(img, iw, ih);
      var min = Math.min(iw, ih);
      var s = min * 0.55;
      // Oversized images render/display entirely from the 1024 copy + thumb, so
      // drop the full-res original to keep memory sane with big batches.
      var oversized = rsc < 1;
      items.push({
        img: oversized ? null : img,
        url: oversized ? null : url,
        rsrc: rsrc, rsc: rsc, thumbCanvas: thumb,
        w: iw, h: ih, rot: 0,
        crop: {
          x: (iw - s) / 2,
          y: Math.max(0, (ih - s) * 0.28),
          s: s
        },
        include: true, canvas: null, broken: false, dirty: true
      });
      if (oversized) URL.revokeObjectURL(url);
      sharedPalette = null;
      added++; done();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); bad++; done(); };
    img.src = url;
  });

  function done(){
    if (--pending) return;
    if (active < 0 && items.length) select(0);
    drawList();
    drawStrip();            // creates placeholders and queues the new items to render
    if (bad || overflow){
      var extra = [];
      if (bad) extra.push(bad + " failed");
      if (overflow) extra.push(overflow + " over " + MAX_IMAGES + "-image limit");
      setStatus(added + " added, " + extra.join(", "));
    }
  }
}

$("file").addEventListener("change", function(e){ load(e.target.files); e.target.value = ""; });
$("add").addEventListener("click", function(){ $("file").click(); });
$("add2").addEventListener("click", function(){ $("file").click(); });
$("clear").addEventListener("click", clearAll);

["dragenter","dragover"].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); });
});
document.addEventListener("drop", function(e){
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files) load(e.dataTransfer.files);
});

document.addEventListener("paste", function(e){
  var cd = e.clipboardData;
  if (!cd) return;
  var got = [];
  var l = cd.items || [];
  for (var i = 0; i < l.length; i++){
    if (l[i].kind === "file" && /^image\//.test(l[i].type)){
      var f = l[i].getAsFile();
      if (f) got.push(f);
    }
  }
  if (!got.length && cd.files && cd.files.length){
    got = Array.prototype.slice.call(cd.files);
  }
  if (!got.length){ setStatus("Clipboard has no image"); return; }
  e.preventDefault();
  load(got);
});

function seg(id, fn){
  $(id).addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    fn(b.dataset.v);
    renderAll();
  });
}

seg("sizeSeg", function(v){ outSize = parseInt(v, 10); });
seg("modeSeg", function(v){ clamped = v === "1"; });
seg("mixSeg", function(v){ linear = v === "1"; });

$("sharp").addEventListener("input", function(){
  sharpen = this.value / 100;
  $("sharpV").textContent = this.value + "%";
});
$("sharp").addEventListener("change", renderAll);

$("crop").addEventListener("input", function(){
  var it = items[active];
  if (!it) return;
  var ns = Math.min(it.w, it.h) * (this.value / 100);
  var cx = it.crop.x + it.crop.s / 2, cy = it.crop.y + it.crop.s / 2;
  it.crop.s = ns;
  it.crop.x = cx - ns / 2;
  it.crop.y = cy - ns / 2;
  clampCrop(it);
  place();
});
$("crop").addEventListener("change", commit);

$("inc").addEventListener("change", function(){
  var it = items[active];
  if (!it) return;
  it.include = this.checked;
  sharedPalette = null;               // export set changed
  drawList(); drawStrip();
  if (reduceColors && paletteScope === "all") renderAll();
});

/* Rotate the crop box of the active image — any angle (for tilted / upside-down
   characters). The box spins live; the output re-renders when a value settles. */
function showRotation(it){
  var norm = (((it.rot || 0) % 360) + 360) % 360;
  $("rotV").textContent = Math.round(norm) + "°";
  if (+$("rotSlider").value !== Math.round(norm)) $("rotSlider").value = Math.round(norm);
  place();
}
function commitRotation(it){
  it.rot = (((it.rot || 0) % 360) + 360) % 360;
  showRotation(it);
  try { render(it); } catch (err){ it.broken = true; setStatus(err.message); }
  if (reduceColors && paletteScope === "all") sharedPalette = null;
}
$("rotSeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  var it = items[active];
  if (!it) return;
  it.rot = b.dataset.r === "reset" ? 0 : (it.rot || 0) + parseInt(b.dataset.r, 10);
  commitRotation(it);
});
$("rotSlider").addEventListener("input", function(){
  var it = items[active];
  if (!it) return;
  it.rot = parseInt(this.value, 10);       // spin the box live, no re-render yet
  $("rotV").textContent = it.rot + "°";
  place();
});
$("rotSlider").addEventListener("change", function(){
  var it = items[active];
  if (it) commitRotation(it);              // render the output on release
});

/* Zoom is a pure view control — enlarges the stage, never re-renders output. */
function applyZoom(z){
  z = Math.min(6, Math.max(1, z));
  zoom = z;
  var pct = Math.round(z * 100);
  $("zoom").value = pct;                       // thumb may snap to step; label stays exact
  $("zoomV").textContent = pct === 100 ? "Fit" : (pct + "%");
}

$("zoom").addEventListener("input", function(){
  applyZoom(this.value / 100);
  if (active >= 0) place();
});

/* Scroll-wheel zoom, anchored to the cursor so it zooms toward what you point at. */
$("stage").addEventListener("wheel", function(e){
  if (active < 0) return;
  e.preventDefault();
  var it = items[active], stage = this, pic = $("pic");
  // Cursor position as a fraction of the image's own on-screen box.
  var pr = pic.getBoundingClientRect();
  var rx = (e.clientX - pr.left) / (pr.width || 1);
  var ry = (e.clientY - pr.top) / (pr.height || 1);
  var before = zoom;
  applyZoom(zoom * (e.deltaY < 0 ? 1.15 : 1/1.15));
  if (zoom === before) return;
  place();
  // Keep the same fraction under the cursor (image is always upright now).
  var pr2 = pic.getBoundingClientRect();
  stage.scrollLeft += pr2.left - (e.clientX - rx * pic.clientWidth);
  stage.scrollTop  += pr2.top  - (e.clientY - ry * pic.clientHeight);
}, { passive: false });

/* Middle-mouse drag pans the stage (move the camera around a zoomed image). */
(function(){
  var stage = $("stage");
  var panning = false, sx = 0, sy = 0, sl = 0, st = 0, pid = 0;

  stage.addEventListener("pointerdown", function(e){
    if (e.button !== 1 || active < 0) return;
    panning = true; pid = e.pointerId;
    sx = e.clientX; sy = e.clientY;
    sl = stage.scrollLeft; st = stage.scrollTop;
    try { stage.setPointerCapture(pid); } catch (_){}
    stage.classList.add("panning");
    e.preventDefault();
  });
  stage.addEventListener("pointermove", function(e){
    if (!panning) return;
    stage.scrollLeft = sl - (e.clientX - sx);   // grab-hand: content follows the cursor
    stage.scrollTop  = st - (e.clientY - sy);
    e.preventDefault();
  });
  function end(){
    if (!panning) return;
    panning = false;
    try { stage.releasePointerCapture(pid); } catch (_){}
    stage.classList.remove("panning");
  }
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
  // Suppress the browser's middle-click autoscroll cursor.
  stage.addEventListener("mousedown", function(e){ if (e.button === 1) e.preventDefault(); });
  stage.addEventListener("auxclick", function(e){ if (e.button === 1) e.preventDefault(); });
})();

$("colSeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on");
  reduceColors = b.dataset.c === "1";
  if (reduceColors && paletteScope === "all") sharedPalette = null;
  renderAll();
});

$("palSeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on");
  paletteScope = b.dataset.p;
  sharedPalette = null;
  if (reduceColors) renderAll();
});

window.addEventListener("resize", function(){ if (active >= 0) place(); });
$("pic").addEventListener("load", place);

var CRC = (function(){
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf){
  var c = 0xFFFFFFFF;
  for (var i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zip(files){
  var enc = new TextEncoder();
  var parts = [], central = [], offset = 0;

  files.forEach(function(f){
    var name = enc.encode(f.name);
    var crc = crc32(f.data), len = f.data.length;

    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(12, 0x2100, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, len, true);
    lh.setUint32(22, len, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);

    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(14, 0x2100, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, len, true);
    ch.setUint32(24, len, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);

    offset += 30 + name.length + len;
  });

  var cSize = central.reduce(function(a, b){ return a + b.length; }, 0);
  var eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true);
  eo.setUint16(10, files.length, true);
  eo.setUint32(12, cSize, true);
  eo.setUint32(16, offset, true);

  return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: "application/zip" });
}

function blobOf(canvas){
  return new Promise(function(res){ canvas.toBlob(res, "image/png"); });
}

function bytesOf(canvas){
  return blobOf(canvas).then(function(b){ return b.arrayBuffer(); })
    .then(function(ab){ return new Uint8Array(ab); });
}

function saveBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

$("copy").addEventListener("click", copyActive);

function copyActive(){
  var it = items[active];
  if (!it) return;
  var p = blobOf(render(it));
  if (!navigator.clipboard || !window.ClipboardItem || !navigator.clipboard.write){
    p.then(function(b){ setStatus("No clipboard support, saved instead"); saveBlob(b, "icon.png"); });
    return;
  }
  try {
    navigator.clipboard.write([ new ClipboardItem({ "image/png": p }) ])
      .then(function(){ setStatus("Copied at " + outSize + "px"); })
      .catch(function(){
        p.then(function(b){ setStatus("Clipboard blocked, saved instead"); saveBlob(b, "icon.png"); });
      });
  } catch (err){
    p.then(function(b){ setStatus("Clipboard blocked, saved instead"); saveBlob(b, "icon.png"); });
  }
}

window.addEventListener("keydown", function(e){
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key !== "c" && e.key !== "C") return;
  var sel = window.getSelection();
  if (sel && String(sel).length) return;
  if (active < 0) return;
  e.preventDefault();
  copyActive();
});

$("save").addEventListener("click", function(){
  var btn = this;
  var keep = items.filter(function(x){ return x.include; });
  if (!keep.length) return;
  btn.disabled = true;
  setStatus("Packing " + keep.length + " files");

  Promise.all(keep.map(function(it, i){
    return bytesOf(render(it)).then(function(data){
      return { name: exportName(i), data: data };
    });
  })).then(function(files){
    saveBlob(zip(files), "icons_" + outSize + ".zip");
    btn.disabled = false;
    setStatus("Exported " + files.length + " files");
  }).catch(function(err){
    btn.disabled = false;
    setStatus("Export failed: " + err.message);
  });
});

})();
</script>
